<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Similarity Rater</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e2e0db; --accent: #2f6f4f; --accent-soft: #e3efe8; --x: #5b4bb7; --x-soft: #ebe8f8;
    --warn: #a35a00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --panel: #1f1f22; --text: #ececee; --muted: #9a9aa2;
      --line: #333338; --accent: #6cc496; --accent-soft: #1f3a2c; --x: #a99bf5; --x-soft: #2c2748;
      --warn: #f0a24a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .progress { height: 4px; background: var(--line); border-radius: 2px; margin: 12px 0 20px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .mode { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600; margin-bottom: 14px; }
  .question { font-size: 17px; margin: 0 0 16px; }
  .players { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .clip { border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 16px 10px;
    cursor: pointer; text-align: center; color: var(--text); font: inherit; transition: border-color .15s; }
  .clip .label { font-size: 26px; font-weight: 700; }
  .clip .hint { color: var(--muted); font-size: 12px; }
  .clip.x .label { color: var(--x); }
  .clip.playing { border-color: var(--accent); background: var(--accent-soft); }
  .clip.x.playing { border-color: var(--x); background: var(--x-soft); }
  .clip.unheard .hint::after { content: " · not heard yet"; color: var(--warn); }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0; }
  .choices { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; margin: 20px 0 14px; }
  .choice { padding: 14px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel);
    color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
  .choice.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .choice small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tags .lbl { color: var(--muted); font-size: 13px; width: 100%; }
  .tag { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px;
    padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .tag.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  textarea { width: 100%; min-height: 54px; resize: vertical; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); padding: 8px 10px; font: inherit; font-size: 14px; }
  .submit { margin-top: 12px; width: 100%; padding: 13px; border: 0; border-radius: 10px; font: inherit;
    font-weight: 700; background: var(--accent); color: var(--panel); cursor: pointer; }
  .submit:disabled { opacity: .4; cursor: not-allowed; }
  .keys { color: var(--muted); font-size: 12px; margin-top: 10px; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
    font: 11px ui-monospace, monospace; background: var(--panel); }
  .reveal { margin-top: 26px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 10px;
    font-size: 13px; color: var(--muted); }
  .reveal b { color: var(--text); font-weight: 600; }
  .done { text-align: center; padding: 60px 0; }
  @media (max-width: 520px) { .clip .label { font-size: 20px; } .choices { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Which sounds more like X?</h1>
    <span class="meta" id="meta">loading…</span>
  </header>
  <div class="progress"><div id="progress"></div></div>

  <section id="task" hidden>
    <span class="mode" id="mode"></span>
    <p class="question" id="question"></p>
    <div class="players">
      <button class="clip x" data-k="x"><div class="label">X</div><div class="hint">reference · <kbd>1</kbd></div><div class="bar"><div></div></div></button>
      <button class="clip" data-k="a"><div class="label">A</div><div class="hint"><kbd>2</kbd></div><div class="bar"><div></div></div></button>
      <button class="clip" data-k="b"><div class="label">B</div><div class="hint"><kbd>3</kbd></div><div class="bar"><div></div></div></button>
    </div>

    <div class="choices">
      <button class="choice" data-c="a">A is closer<small><kbd>F</kbd> / <kbd>←</kbd></small></button>
      <button class="choice" data-c="tie">Can't tell<small><kbd>↓</kbd></small></button>
      <button class="choice" data-c="b">B is closer<small><kbd>J</kbd> / <kbd>→</kbd></small></button>
    </div>

    <div class="tags" id="tags">
      <span class="lbl">Because of… (optional, pick any)</span>
    </div>
    <textarea id="note" placeholder="Optional note: what made it closer? e.g. 'same airy pads', 'that clap'"></textarea>
    <button class="submit" id="submit" disabled>Submit <kbd>Enter</kbd></button>
    <div class="keys"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> switch clips at the same position · <kbd>Space</kbd> pause/resume · listen to all three before submitting</div>
  </section>

  <section class="done" id="done" hidden>
    <h2>All triplets rated 🎉</h2>
    <p class="meta">Ratings are saved in ratings.jsonl.</p>
  </section>

  <div class="reveal" id="reveal" hidden></div>
</main>

<script>
const TAGS = ["drums/percussion", "bass", "vocals", "instruments/melody", "atmosphere/space", "groove/tempo", "era/production"];
const STEM_NAMES = { mix: "Full mix", drums: "Drums only", bass: "Bass only", vocals: "Vocals only", other: "Other instruments only" };
const $ = (id) => document.getElementById(id);
let cur = null, audio = {}, active = null, heard = new Set(), choice = null, tags = new Set();
let startedAt = 0, switches = 0;

for (const t of TAGS) {
  const b = document.createElement("button");
  b.className = "tag"; b.textContent = t;
  b.onclick = () => { tags.has(t) ? tags.delete(t) : tags.add(t); b.classList.toggle("on"); };
  $("tags").appendChild(b);
}

async function load() {
  const [next, stats] = await Promise.all([fetch("/api/next").then(r => r.json()), fetch("/api/stats").then(r => r.json())]);
  const cons = stats.repeats_checked ? ` · self-consistency ${stats.consistent}/${stats.repeats_checked}` : "";
  $("meta").textContent = `${next.rated} / ${next.total} rated${cons}`;
  $("progress").style.width = `${100 * next.rated / next.total}%`;
  if (next.done) { $("task").hidden = true; $("done").hidden = false; return; }
  cur = next; heard = new Set(); choice = null; tags = new Set(); switches = 0; startedAt = performance.now();
  Object.values(audio).forEach(a => { a.pause(); a.src = ""; });
  audio = {};
  for (const k of ["x", "a", "b"]) {
    const a = new Audio(next.clips[k]); a.loop = true; a.preload = "auto";
    a.ontimeupdate = () => { document.querySelector(`.clip[data-k=${k}] .bar > div`).style.width = `${100 * a.currentTime / (a.duration || 10)}%`; };
    audio[k] = a;
  }
  active = null;
  $("mode").textContent = STEM_NAMES[next.play] || next.play;
  $("question").textContent = next.play === "mix"
    ? "Listen to X, then A and B. Which one sounds more similar to X overall?"
    : `Only the ${next.play} stem is playing. Which ${next.play} part sounds more like X's?`;
  $("tags").hidden = next.play !== "mix";
  $("note").value = "";
  document.querySelectorAll(".tag").forEach(b => b.classList.remove("on"));
  document.querySelectorAll(".choice").forEach(b => b.classList.remove("selected"));
  document.querySelectorAll(".clip").forEach(b => { b.classList.remove("playing"); b.classList.add("unheard"); });
  document.querySelectorAll(".bar > div").forEach(d => d.style.width = "0");
  $("task").hidden = false;
  refreshSubmit();
}

function play(k) {
  const pos = active ? audio[active].currentTime : 0;
  if (active && active !== k) { audio[active].pause(); switches++; }
  if (active === k && !audio[k].paused) { audio[k].pause(); render(); return; }
  active = k;
  audio[k].currentTime = pos;
  audio[k].play();
  heard.add(k);
  render();
}

function render() {
  document.querySelectorAll(".clip").forEach(b => {
    const k = b.dataset.k;
    b.classList.toggle("playing", k === active && !audio[k].paused);
    b.classList.toggle("unheard", !heard.has(k));
  });
  refreshSubmit();
}

function choose(c) {
  choice = c;
  document.querySelectorAll(".choice").forEach(b => b.classList.toggle("selected", b.dataset.c === c));
  refreshSubmit();
}

function refreshSubmit() { $("submit").disabled = !(choice && heard.size === 3); }

async function submit() {
  if ($("submit").disabled) return;
  Object.values(audio).forEach(a => a.pause());
  const res = await fetch("/api/rate", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: cur.id, choice, tags: [...tags], note: $("note").value.trim(),
      listen_ms: Math.round(performance.now() - startedAt), switches }) }).then(r => r.json());
  const r = res.reveal, fmt = (s) => `<b>${s.name}</b> — ${s.artist}${s.year ? ` (${s.year})` : ""}`;
  $("reveal").innerHTML = `Previous: X = ${fmt(r.x)}<br>A = ${fmt(r.a)}<br>B = ${fmt(r.b)}<br>You picked: <b>${{a: "A", b: "B", tie: "can't tell"}[res.choice]}</b>`;
  $("reveal").hidden = false;
  load();
}

document.querySelectorAll(".clip").forEach(b => b.onclick = () => play(b.dataset.k));
document.querySelectorAll(".choice").forEach(b => b.onclick = () => choose(b.dataset.c));
$("submit").onclick = submit;

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA") { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } return; }
  const k = e.key.toLowerCase();
  if (k === "1") play("x"); else if (k === "2") play("a"); else if (k === "3") play("b");
  else if (k === "f" || e.key === "ArrowLeft") choose("a");
  else if (k === "j" || e.key === "ArrowRight") choose("b");
  else if (e.key === "ArrowDown") choose("tie");
  else if (e.key === "Enter") submit();
  else if (e.key === " ") { e.preventDefault(); if (active) play(active); }
  else return;
});

load();
</script>
</body>
</html>
